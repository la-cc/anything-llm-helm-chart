###### Anything-LLM ######
# -- Override the full name of the chart.
fullnameOverride: "anything-llm"

# -- Number of pod replicas to deploy.
replicaCount: 1

# -- Configuration for the Docker image used by the pod.
image:
  # -- The Docker repository to pull the image from.
  repository: ghcr.io/mintplex-labs/anything-llm
  # -- The specific tag of the image to use.
  tag: 1.2.2
  # -- The pull policy for the image. IfNotPresent means the image will only be pulled if it is not already present locally.
  pullPolicy: IfNotPresent

# -- Service configuration.
service:
  # -- Service type.
  type: ClusterIP
  # -- Service port.
  port: 3001
    # -- Optional annotations for the Service.
  # annotations:
    # Example for GCE Ingress on Google Cloud (enables NEG):
    # cloud.google.com/neg: '{"ingress": true}'

# -- Ingress configuration.
ingress:
  # -- Enable ingress.
  enabled: true
  # -- Ingress annotations.
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-dns
    cert-manager.io/renew-before: 360h
  # -- Ingress class name.
  ingressClassName: nginx
  # -- Ingress hosts.
  hosts:
    - host: llm.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- TLS configuration for ingress.
  tls:
    - hosts:
        - llm.example.com
      secretName: anything-llm-tls

# -- Persistence configuration.
persistence:
  # -- Enable persistence.
  enabled: true
  # -- Access mode for the persistent volume.
  accessMode: ReadWriteOnce
  # -- Size of the persistent volume.
  size: 10Gi
  # -- List of volumes to create.
  volumes:
    - name: server-storage
      mountPath: /app/server/storage

# -- Configuration for the application.
config:
  STORAGE_DIR: "/app/server/storage"
  # -- Configuration for the embedding model.
  EMBEDDING_MODEL_PREF: "nomic-embed-text:1.5"
  EMBEDDING_MODEL_MAX_CHUNK_LENGTH: "8192"
  # -- Configuration for the vector db like lanceDB (in storage) or chroma DB (external), etc.
  VECTOR_DB: "lancedb"
    # ChromaDB: Enable all below if you are using chroma.
    # VECTOR_DB: chroma
    # CHROMA_ENDPOINT: http://anything-llm-chromadb:8000
  WHISPER_PROVIDER: "local"
  TTS_PROVIDER: "native"
  # -- Configuration for LLM provider like ollama, azure openai, etc.
# Ollama LLM and Embedding
  # LLM_PROVIDER='ollama'
  # OLLAMA_BASE_PATH: 'http://svc-name.namespace.svc.cluster.local:11434'
  # OLLAMA_MODEL_PREF: 'llama2'
  # OLLAMA_MODEL_TOKEN_LIMIT=8192
  # EMBEDDING_BASE_PATH: 'http://svc-name.namespace.svc.cluster.local:11434'
# Azure OpenAI and Embedding
  # AZURE_OPENAI_ENDPOINT: https://replace-me.openai.azure.com/
  # OPEN_MODEL_PREF: "gpt-4o"
  # EMBEDDING_MODEL_PREF: "text-embedding-ada-002"
  # EMBEDDING_ENGINE: 'azure'
# OpenAI and Embedding
  # LLM_PROVIDER: 'openai'
  # OPEN_MODEL_PREF: 'gpt-4o-mini'
  # EMBEDDING_MODEL_PREF: "text-embedding-ada-002"
  # EMBEDDING_ENGINE: 'openai'


# -- Secret configuration.
secret:
  # -- Enable secrets.
  enabled: true
  # -- Name of the secret, if not set, a secret is generated.
  name: ""
  # -- Secret data.
  data:
    AUTH_TOKEN: "replace-me"
    JWT_SECRET: "replace-me"
  # Azure OpenAI
    # AZURE_OPENAI_KEY: "50f...."
  # OpenAI
    # OPEN_AI_KEY: "sk-...



###### CHROMADB ######
chromadb:
  enabled: false
  chromadb:
    auth:
      enabled: false
  service:
    type: ClusterIP

###### OLLAMA ######
ollama:
  enabled: false
  fullnameOverride: "ollama"
  ollama:
    gpu:
      enabled: true
    type: "nvidia"
    number: 1
    models:
      - gemma2
  tolerations:
    - key: "ai"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 50Gi
    storageClass: ""
  autoscaling:
    enabled: false
    maxReplicas: 1
  image:
    repository: ollama/ollama
    tag: 0.3.12

###### NVIDIA DEVICE PLUGIN ######
nvidia-device-plugin:
  enabled: false
  fullnameOverride: "nvidia-device-plugin"
  resources:
    limits:
      nvidia.com/gpu: 1
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  # nodeSelector:
  #   nvidia.com/gpu: "true"

###### SSO MICROSERVICE ######
sso:
  # -- Enable SSO microservice deployment
  enabled: false
  
  # -- Number of pod replicas to deploy
  replicaCount: 1
  
  # -- Configuration for the Docker image used by the SSO microservice
  image:
    # -- The Docker repository to pull the image from
    repository: sso-anythingllm
    # -- The specific tag of the image to use
    tag: latest
    # -- The pull policy for the image
    pullPolicy: IfNotPresent
  
  # -- Service configuration for SSO microservice
  service:
    # -- Service type
    type: ClusterIP
    # -- Service port
    port: 8000
  
  # -- Ingress configuration for SSO microservice
  ingress:
    # -- Enable ingress for SSO microservice
    enabled: false
    # -- Ingress annotations
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      cert-manager.io/cluster-issuer: letsencrypt-dns
      cert-manager.io/renew-before: 360h
    # -- Ingress class name
    ingressClassName: nginx
    # -- Ingress hosts
    hosts:
      - host: sso.example.com
        paths:
          - path: /
            pathType: Prefix
    # -- TLS configuration for ingress
    tls:
      - hosts:
          - sso.example.com
        secretName: sso-anythingllm-tls
  
      # -- Configuration for the SSO microservice
  config:
    # -- PostgreSQL configuration
    POSTGRES_HOST: "postgresql"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "sso-anythingllm123"
    POSTGRES_DB: "sso_anythingllm"
    # -- Keycloak configuration
    KEYCLOAK_ANYTHING_LLM_ID_CLAIM: "preferred_username"
    KEYCLOAK_ANYTHING_LLM_USERNAME_CLAIM: "preferred_username"
    KEYCLOAK_ANYTHING_LLM_GROUP_CLAIM: "groups"
    KEYCLOAK_ANYTHING_LLM_GROUP_CORRELATIONS: "anything_llm_manager;manager,anything_llm_default;default,anything_llm_admin;admin"
    # -- AnythingLLM API configuration
    ANYTHING_LLM_URL: "https://llm.example.com"
    ANYTHING_LLM_ADMIN_USER: "admin"
    ANYTHING_LLM_ADMIN_PASSWORD: "administrador"
    ANYTHING_LLM_VERIFY_SSL: "false"
  
  # -- Resources for SSO microservice
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  # -- Database migration configuration
  migrations:
    # -- Enable database migrations
    enabled: true
    # -- Migration strategy: "job" or "init-container"
    strategy: "init-container"
  
  # -- Node selector for SSO microservice
  # nodeSelector: {}
  
  # -- Affinity for SSO microservice
  # affinity: {}
  
  # -- Tolerations for SSO microservice
  # tolerations: []
  
  # -- PostgreSQL deployment configuration
  postgresql:
    # -- Enable PostgreSQL deployment
    enabled: false
    # -- PostgreSQL configuration
    auth:
      postgresPassword: "sso-anythingllm123"
      database: "sso_anythingllm"
      enablePostgresUser: true
    # -- PostgreSQL service configuration
    service:
      type: ClusterIP
      port: 5432
    # -- PostgreSQL persistence configuration
    primary:
      persistence:
        enabled: true
        size: 8Gi
        storageClass: ""
      # -- Extra volumes for official PostgreSQL image compatibility
      # Mount emptyDir for /var/run/postgresql to fix read-only filesystem issue
      extraVolumes:
        - name: postgresql-run
          emptyDir: {}
      extraVolumeMounts:
        - name: postgresql-run
          mountPath: /var/run/postgresql

    # -- PostgreSQL resources
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    # -- PostgreSQL architecture
    architecture: standalone
    # -- PostgreSQL image configuration
    # Using official PostgreSQL image instead of Bitnami due to licensing changes
    # The official PostgreSQL image (postgres:16) uses standard env vars:
    # POSTGRES_PASSWORD, POSTGRES_DB, POSTGRES_USER
    # Note: The Bitnami chart may need extraEnvVars to map auth values correctly
    # If authentication fails, you may need to add extraEnvVars mapping
    image:
      registry: docker.io
      repository: postgres
      tag: "16"
    # -- PostgreSQL metrics
    metrics:
      enabled: false